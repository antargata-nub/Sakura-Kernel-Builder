name: Build Kernel Universal

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "URL repo source kernel"
        required: true
        type: string
        default: 
      KERNEL_BRANCH:
        description: "Branch source kernel"
        required: true
        type: string
        default: "old/main-dynamic"
      KERNEL_CONFIG:
        description: "Defconfig dasar (relatif ke arch/<arch>/configs), mis. vendor/xiaomi/sdm660_defconfig atau lavender_defconfig"
        required: true
        type: string
        default: 
      KERNEL_FRAGMENT:
        description: "Fragment config (pisahkan spasi, kosongkan jika tidak ada), mis. vendor/xiaomi/lavender.config"
        required: false
        type: string
        default: 
      KERNEL_NAME:
        description: "Nama kernel (untuk penamaan file)"
        required: true
        type: string
        default: "Southwest"
      CODENAME:
        description: "Codename device (contoh: lavender, surya, ginkgo)"
        required: true
        type: string
        default: "lavender"
      TARGET_ARCH:
        description: "Arsitektur target"
        required: true
        type: choice
        options: [arm64, arm]
        default: arm64
      RUNNER:
        description: "OS runner (Gunakan ubuntu-22.04 untuk Clang 11-13 / kernel 4.4/4.9)"
        required: true
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-24.04
      COMPILER:
        description: "Pilih Compiler / Toolchain"
        required: true
        type: choice
        options:
          - zyc-clang-20
          - zyc-clang-19
          - proton-clang-13
          - aosp-clang-r41637b
          - greenforce-clang
          - clang-22
          - clang-21
          - clang-20
          - clang-19
          - clang-18
          - clang-17
          - clang-16
          - clang-15
          - clang-14
          - clang-13
          - clang-12
          - clang-11
          - custom
        default: zyc-clang-20
      CLANG_CUSTOM_URL:
        description: "Hanya untuk COMPILER=custom: URL archive (.tar.gz / .tar.xz / .zip) atau git repo"
        required: false
        type: string
        default: ""
      CLANG_CUSTOM_BRANCH:
        description: "Hanya untuk custom + git repo: branch/tag (opsional)"
        required: false
        type: string
        default: ""
      LTO_MODE:
        description: "Mode LTO (otomatis dilewati jika source tidak mendukung)"
        required: true
        type: choice
        options: [thin, full, none]
        default: thin
      EXTRA_KCFLAGS:
        description: "KCFLAGS tambahan"
        required: false
        type: string
        default: "-Wno-error"
      EXTRA_MAKE_ARGS:
        description: "Argumen make tambahan, pisahkan spasi (misal: LLVM_IAS=0 untuk kernel 4.4/4.9 + Clang baru)"
        required: false
        type: string
        default: ""
      KSU_VARIANT:
        description: "Varian KernelSU (none = polos, 4.4/4.9 butuh backport manual di source)"
        required: true
        type: choice
        options: [none, xxksu, ksu-next, ksu-original]
        default: none
      KSU_ENABLE_MODULES:
        description: "Hanya ksu-next/original: aktifkan CONFIG_MODULES & KPROBES"
        required: false
        type: boolean
        default: true
      KSU_PATCH_URL:
        description: "URL patch manual hook KSU (kosongkan untuk auto 4.14/4.19)"
        required: false
        type: string
        default: ""
      MANAGER_AUTO:
        description: "Sertakan APK manager sesuai varian KSU"
        required: true
        type: boolean
        default: true
      MGR_EXTRA:
        description: "Manager ekstra (pisahkan koma: original,next,rksu,kowsu)"
        required: false
        type: string
        default: ""
      BUILD_ANYKERNEL3:
        description: "Kemas zip AnyKernel3"
        required: true
        type: boolean
        default: true
      AK3_REPO:
        description: "URL repo AnyKernel3 milikmu (kosong = AnyKernel3 generik)"
        required: false
        type: string
        default: ""
      AK3_BLOCK:
        description: "Path partisi boot (Qualcomm umumnya /dev/block/bootdevice/by-name/boot)"
        required: false
        type: string
        default: "/dev/block/bootdevice/by-name/boot"
      AK3_SLOT_DEVICE:
        description: "Device A/B slot? (0 = bukan, 1 = ya, auto = deteksi)"
        required: false
        type: choice
        options: ["0", "1", auto]
        default: "0"
      PUBLISH_RELEASE:
        description: "Publikasikan ke GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.RUNNER }}
    timeout-minutes: 180
    env:
      KERNEL_SOURCE: ${{ inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ inputs.KERNEL_CONFIG }}
      KERNEL_FRAGMENT: ${{ inputs.KERNEL_FRAGMENT }}
      KERNEL_NAME: ${{ inputs.KERNEL_NAME }}
      CODENAME: ${{ inputs.CODENAME }}
      TARGET_ARCH: ${{ inputs.TARGET_ARCH }}
      COMPILER: ${{ inputs.COMPILER }}
      CLANG_CUSTOM_URL: ${{ inputs.CLANG_CUSTOM_URL }}
      CLANG_CUSTOM_BRANCH: ${{ inputs.CLANG_CUSTOM_BRANCH }}
      LTO_MODE: ${{ inputs.LTO_MODE }}
      EXTRA_KCFLAGS: ${{ inputs.EXTRA_KCFLAGS }}
      EXTRA_MAKE_ARGS: ${{ inputs.EXTRA_MAKE_ARGS }}
      KSU_VARIANT: ${{ inputs.KSU_VARIANT }}
      KSU_ENABLE_MODULES: ${{ inputs.KSU_ENABLE_MODULES }}
      KSU_PATCH_URL: ${{ inputs.KSU_PATCH_URL }}
      MANAGER_AUTO: ${{ inputs.MANAGER_AUTO }}
      MGR_EXTRA: ${{ inputs.MGR_EXTRA }}
      BUILD_ANYKERNEL3: ${{ inputs.BUILD_ANYKERNEL3 }}
      AK3_REPO: ${{ inputs.AK3_REPO }}
      AK3_BLOCK: ${{ inputs.AK3_BLOCK }}
      AK3_SLOT_DEVICE: ${{ inputs.AK3_SLOT_DEVICE }}
      PUBLISH_RELEASE: ${{ inputs.PUBLISH_RELEASE }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: Catat waktu mulai
        run: echo "START_EPOCH=$(date +\%s)" >> "$GITHUB_ENV"

      - name: Telegram - siapkan helper
        if: ${{ env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        run: |
          cat > /tmp/tg.sh <<'EOF'
          API="https://api.telegram.org/bot${BOT_TOKEN}"
          tg_msg() {
            curl -sS -X POST "$API/sendMessage" \
              --data-urlencode chat_id="$CHAT_ID" \
              --data-urlencode text="$1" \
              -d disable_web_page_preview=true -o /tmp/tg_resp.json || true
            jq -e '.ok' /tmp/tg_resp.json >/dev/null 2>&1 \
              || echo "::warning::Telegram menolak pesan: $(cat /tmp/tg_resp.json 2>/dev/null)"
          }
          tg_file() {
            local sz
            sz=$(stat -c %s "$1")
            if [ "$sz" -gt 49000000 ]; then
              tg_msg "File $(basename "$1") terlalu besar untuk Telegram ($((sz/1048576)) MB). Ambil dari Release atau Artifacts."
              return 0
            fi
            curl -sS -X POST "$API/sendDocument" \
              -F chat_id="$CHAT_ID" -F document=@"$1" -F caption="$2" -o /tmp/tg_resp.json || true
            jq -e '.ok' /tmp/tg_resp.json >/dev/null 2>&1 \
              || echo "::warning::Telegram menolak file: $(cat /tmp/tg_resp.json 2>/dev/null)"
          }
          EOF

      - name: Telegram - build dimulai
        if: ${{ env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        continue-on-error: true
        run: |
          source /tmp/tg.sh
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tg_msg "🚀 Build Dimulai
          - Kernel   : ${KERNEL_NAME} (${CODENAME})
          - Source   : ${KERNEL_SOURCE} @${KERNEL_BRANCH}
          - Config   : ${KERNEL_CONFIG}${KERNEL_FRAGMENT}
          - Arch     : ${TARGET_ARCH}
          - Compiler : ${COMPILER}
          - LTO      : ${LTO_MODE}
          - KernelSU : ${KSU_VARIANT}
          - Run      : ${RUN_URL}"

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip unzip jq \
            python3 ccache git wget curl lsb-release software-properties-common gnupg \
            device-tree-compiler u-boot-tools lz4 xz-utils rsync zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Install compiler (${{ inputs.COMPILER }})
        run: |
          set -euo pipefail
          mkdir -p toolchain/clang

          case "$COMPILER" in
            proton-clang-13)
              echo "Mengunduh Proton Clang 13..."
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
              ;;
            aosp-clang-r41637b)
              echo "Mengunduh AOSP Clang r41637b..."
              git clone --depth=1 https://github.com/PoomSmart/aosp-clang.git -b r41637b toolchain/clang || \
              git clone --depth=1 https://github.com/aosp-realm/clang-r41637b.git toolchain/clang
              ;;
            zyc-clang-20)
              echo "Mengunduh ZyC Clang 20..."
              URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | jq -r '.assets[]? | select(.name | contains("ZyC-Clang-20")) | .browser_download_url' | head -n1)
              if [ -z "$URL" ] \vert{}\vert{} [ "$URL" = "null" ]; then
                URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | jq -r '.[].assets[]? | select(.name | contains("ZyC-Clang-20")) | .browser_download_url' | head -n1)
              fi
              curl -fLsS "$URL" | tar -xJ -C toolchain/clang
              ;;
            zyc-clang-19)
              echo "Mengunduh ZyC Clang 19..."
              URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/tags/19.0.0-20240901 | jq -r '.assets[]? | select(.name | contains("ZyC-Clang-19")) | .browser_download_url' | head -n1)
              if [ -z "$URL" ] \vert{}\vert{} [ "$URL" = "null" ]; then
                URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | jq -r '.[].assets[]? | select(.name | contains("ZyC-Clang-19")) | .browser_download_url' | head -n1)
              fi
              curl -fLsS "$URL" | tar -xJ -C toolchain/clang
              ;;
            greenforce-clang)
              echo "Mengunduh GreenForce Clang..."
              git clone --depth=1 https://github.com/GreenForce-Project/greenforce_clang.git toolchain/clang || \
              git clone --depth=1 https://github.com/StatiXOS/android_prebuilts_clang_host_linux-x86_clang-r41637b.git toolchain/clang
              ;;
            custom)
              [ -n "$CLANG_CUSTOM_URL" ] || { echo "::error::COMPILER=custom tapi CLANG_CUSTOM_URL kosong"; exit 1; }
              case "$CLANG_CUSTOM_URL" in
                *.tar.gz|*.tgz) curl -fLsS "$CLANG_CUSTOM_URL" | tar -xz -C toolchain/clang ;;
                *.tar.xz)        curl -fLsS "$CLANG_CUSTOM_URL" | tar -xJ -C toolchain/clang ;;
                *.tar.zst)       curl -fLsS "$CLANG_CUSTOM_URL" | tar --zstd -x -C toolchain/clang ;;
                *.zip)
                  curl -fLsS -o /tmp/toolchain.zip "$CLANG_CUSTOM_URL"
                  unzip -q /tmp/toolchain.zip -d toolchain/clang ;;
                *)
                  if [ -n "$CLANG_CUSTOM_BRANCH" ]; then
                    git clone --depth=1 -b "$CLANG_CUSTOM_BRANCH" "$CLANG_CUSTOM_URL" toolchain/clang
                  else
                    git clone --depth=1 "$CLANG_CUSTOM_URL" toolchain/clang
                  fi ;;
              esac
              ;;
            clang-*)
              V="${COMPILER#clang-}"
              if ! sudo apt-get install -y --no-install-recommends "clang-$V" "lld-$V" "llvm
